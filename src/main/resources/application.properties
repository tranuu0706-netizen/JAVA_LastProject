# ═══════════════════════════════════════════════════════════
# CodeAnalyzer - Application Properties
# ═══════════════════════════════════════════════════════════

# ========== DATABASE CONFIGURATION (SQL SERVER) ==========
# Có thể override bằng biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD
# hoặc JVM properties -Ddb.url=... -Ddb.username=... -Ddb.password=...
db.url=jdbc:sqlserver://localhost;databaseName=code_analyzer;encrypt=true;trustServerCertificate=true;
db.username=sa
db.password=tranut012

# ========== GEMINI API KEY ==========
# Lấy key tại: https://aistudio.google.com/apikey
gemini.api.key=
gemini.model=gemini-2.5-flash
gemini.request.delay.ms=10000
gemini.max.output.tokens=4096

# ========== EDGE PROFILE PATH (ở ổ D) ==========
edge.profile.path=D:\\CodeAnalyzerProfile

# ========== EDGE DRIVER PATH (ở ổ D) ==========
edge.driver.path=

# Crawl Settings
crawl.interval.hours=24
crawl.start.time=02:00
crawl.max.submissions=500
crawl.delay.min.ms=2000
crawl.delay.max.ms=5000

# Analysis Settings
analysis.batch.size=5
analysis.max.code.length=4000
